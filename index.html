          h("button", {class:"mini", onclick:()=>pick([td])}, "今天"),
          h("button", {class:"mini", onclick:()=>pick([addDays(td,1)])}, "明天"),
          c.days.length ? h("button", {class:"mini", onclick:()=>pick([])}, "不定日期") : null,
          h("button", {class:"mini", style:"margin-left:auto;color:var(--ink);font-weight:700", onclick:()=>closePop()}, "完成")));
    }
  }
  document.addEventListener("mousedown", e=>{
    if(pop.hidden) return;
    if(pop.contains(e.target) || e.target.closest('[data-act="cat"],[data-act="date"],[data-act="proj"],[data-act="ddate"],[data-act="evt"]')) return;
    closePop();
  });
  window.addEventListener("resize", ()=>{ if(!pop.hidden) placePop(); });

  /* ---------- editor drawer (used from the calendars) ---------- */
  const dr = $("#drawer");
  let editId = null;
  let drNotesMode = null;
  function renderDrNotes(t, nm){
    $("#dNotesView").innerHTML = t.notes.trim() ? renderMd(t.notes) : '<p class="md-empty">'+(nm==="split" ? "在左边写，这里实时显示效果。" : "还没有笔记，点「编辑」开始写。")+'</p>';
  }
  function openEditor(id){
    if(editId!==id) drNotesMode = null;
    editId = id; closePop(); fillEditor(true);
    renderMain();
    dr.classList.add("open"); dr.setAttribute("aria-hidden","false"); $("#scrim").classList.add("show");
    dr.focus({preventScroll:true});
  }
  function closeEditor(){
    if(!editId) return;
    editId = null; dr.classList.remove("open"); dr.setAttribute("aria-hidden","true"); $("#scrim").classList.remove("show");
    $$("#main .row.sel").forEach(r=>r.classList.remove("sel"));
  }
  function fillEditor(force){
    const t = getTask(editId); if(!t){ closeEditor(); return; }
    const f = document.activeElement;
    $("#dChk").classList.toggle("on", t.completed);
    if(force || f!==$("#dTitle")){ $("#dTitle").value = t.title; autosize($("#dTitle")); }
    if(force || f!==$("#dNotes")) $("#dNotes").value = t.notes;
    const box = $("#dCats"); box.textContent = "";
    CATS.forEach(c=>box.append(h("button", {class:"cat"+(t.categories.includes(c)?"":" off"), style:"--c:"+catColor(c)+";line-height:26px;padding:0 12px;font-size:13px", "aria-pressed":String(t.categories.includes(c)),
      onclick:()=>{ t.categories = t.categories.includes(c) ? t.categories.filter(x=>x!==c) : [...t.categories, c].sort((a,b)=>CATS.indexOf(a)-CATS.indexOf(b)); save(); fillEditor(); renderMain(); }}, c)));
    const sel = $("#dProj"); sel.textContent = "";
    sel.append(h("option", {value:"", text:"不属于项目"}), ...state.projects.map(p=>h("option", {value:p.id, text:p.name})));
    sel.value = t.project || "";
    $("#dDateBtn").textContent = t.date ? daysLabel(daysOf(t)) : "选择日期";
    $("#dTime").value = timeOf(t) || "";
    $("#dPoms").textContent = t.poms;
    $("#dFocus").hidden = !canFocus(t);
    $("#dOpenProj").hidden = !getProj(t.project);
    const log = $("#dLog"); log.textContent = "";
    if(t.completed) log.append(h("div", {class:"dl fin"}, "✓ 完成于 "+(t.doneAt ? (t.doneAt===todayStr() ? "今天" : dayLabel(t.doneAt)) : "（日期未记录）")));
    const lk = Object.keys(t.pomLog).sort().reverse();
    lk.forEach(k=>log.append(h("div", {class:"dl"}, h("b", {text: k===todayStr() ? "今天 "+md(k) : dayLabel(k)}), h("span", {class:"pom"}, h("i",{class:"tom"}), t.pomLog[k]+" 个番茄"))));
    const unlogged = t.poms - lk.reduce((n,k)=>n+t.pomLog[k],0);
    if(unlogged>0) log.append(h("div", {class:"dl"}, h("b", {text:"更早"}), h("span", {class:"pom"}, h("i",{class:"tom"}), unlogged+" 个番茄")));
    if(!t.completed && !lk.length && !unlogged) log.append(h("div", {class:"dl none"}, canFocus(t) ? "还没有专注记录，点下面「专注这项任务」开始" : "还没有记录"));
    const nm = drNotesMode || (t.notes.trim() ? "preview" : "edit");
    [["edit","#dNotesEdit"],["preview","#dNotesPrev"],["split","#dNotesSplit"]].forEach(([k,q])=>$(q).setAttribute("aria-pressed", String(nm===k)));
    $("#dnWrap").classList.toggle("split", nm==="split");
    $("#dNotes").hidden = nm==="preview"; $("#dNotesView").hidden = nm==="edit";
    if(nm!=="edit") renderDrNotes(t, nm);
    if(nm!=="preview") autosize($("#dNotes"));
    $("#dFocus").textContent = t.id===state.activeId && T.running && T.mode==="focus" ? "正在专注" : "专注这项任务";
  }
  const edit = fn => { const t = getTask(editId); if(!t) return; fn(t); save(); fillEditor(); renderAll(); };
  $("#dClose").addEventListener("click", closeEditor);
  $("#scrim").addEventListener("click", closeEditor);
  $("#dChk").addEventListener("click", ()=>edit(t=>{ t.completed = !t.completed; t.doneAt = t.completed ? todayStr() : null; if(t.completed && state.activeId===t.id) state.activeId = null; }));
  $("#dTitle").addEventListener("input", e=>{ e.target.value = e.target.value.replace(/\n/g," "); autosize(e.target); const t = getTask(editId); if(t && e.target.value.trim()){ t.title = e.target.value.trim(); save(); renderMain(); } });
  $("#dTitle").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); e.target.blur(); } });
  $("#dTitle").addEventListener("blur", e=>{ const t = getTask(editId); if(t){ e.target.value = t.title; autosize(e.target); } });
  $("#dNotes").addEventListener("input", e=>{ const t = getTask(editId); if(t){ t.notes = e.target.value; save(); } });
  $("#dNotes").addEventListener("blur", ()=>renderMain());
  $("#dNotes").addEventListener("input", e=>{ autosize(e.target); const t = getTask(editId); if(t && drNotesMode==="split") renderDrNotes(t, "split"); });
  $("#dNotesSplit").addEventListener("click", ()=>{ drNotesMode = "split"; fillEditor(); const n = $("#dNotes"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
  $("#dNotesEdit").addEventListener("click", ()=>{ drNotesMode = "edit"; fillEditor(); const n = $("#dNotes"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
  $("#dNotesPrev").addEventListener("click", ()=>{ drNotesMode = "preview"; fillEditor(); });
  $("#dNotesView").addEventListener("dblclick", e=>{ if(e.target.closest("a,input") || drNotesMode==="split") return; drNotesMode = "edit"; fillEditor(); $("#dNotes").focus(); });
  $("#dNotesView").addEventListener("click", e=>{
    if(!e.target.matches('input[type="checkbox"]')) return;
    const t = getTask(editId); if(!t) return;
    t.notes = toggleMdTask(t.notes, +e.target.dataset.ln); save(); fillEditor(); renderMain();
  });
  $("#dOpenProj").addEventListener("click", ()=>{ const t = getTask(editId); if(!t || !getProj(t.project)) return; const pid = t.project; closeEditor(); if(curProj!==pid){ projTab = "tasks"; curNote = null; } curProj = pid; setView("projects"); });
  $("#dDateBtn").addEventListener("click", e=>{ if(editId) openPop("date", editId, e.currentTarget); });
  $("#dTime").addEventListener("change", e=>edit(t=>{ const a = daysOf(t); setDays(t, a.length ? a : [todayStr()], e.target.value); }));
  $("#dNoDate").addEventListener("click", ()=>edit(t=>{ setDays(t, []); }));
  $("#dPomMinus").addEventListener("click", ()=>edit(t=>{
    if(!t.poms) return;
    t.poms--;
    const k = Object.keys(t.pomLog).sort().pop();
    if(k){ t.pomLog[k]--; if(!t.pomLog[k]) delete t.pomLog[k]; }
  }));
  $("#dPomPlus").addEventListener("click", ()=>edit(t=>{ const td = todayStr(); t.poms++; t.pomLog[td] = (t.pomLog[td]||0) + 1; }));
  $("#dProj").addEventListener("change", e=>edit(t=>setProject(t, e.target.value || null)));
  $("#dFocus").addEventListener("click", ()=>{ const id = editId; closeEditor(); focusTask(id); });
  $("#dDelete").addEventListener("click", ()=>deleteTask(editId));

  $$(".tabs [data-view]").forEach(b=>b.addEventListener("click", ()=>{ if(b.dataset.view==="projects") curProj = null; setView(b.dataset.view); }));

  /* ---------- timer ---------- */
  const T = {mode:"focus", remaining:0, running:false, endAt:0};
  const dur = m => state.settings[m]*60000;
  try{ const t = JSON.parse(localStorage.getItem(LS_TIMER)||"null"); if(t && MODE_NAME[t.mode]) Object.assign(T, t); }catch(e){}
  if(!T.remaining && !T.running) T.remaining = dur(T.mode);
  function saveTimer(){ try{ localStorage.setItem(LS_TIMER, JSON.stringify(T)); }catch(e){} }
  function rollDay(){ if(state.cycleDate!==todayStr()){ state.cycleDate = todayStr(); state.cycle = 0; } }
  function setMode(m, autostart){
    T.mode = m; T.remaining = dur(m); T.running = false; document.body.dataset.mode = m;
    if(autostart) start(); else { saveTimer(); renderTimer(); }
  }
  function start(){ unlockAudio(); T.endAt = Date.now()+T.remaining; T.running = true; saveTimer(); renderTimer(); }
  function pause(){ T.remaining = Math.max(0, T.endAt-Date.now()); T.running = false; saveTimer(); renderTimer(); }
  function toggle(){ T.running ? pause() : start(); if(editId) fillEditor(); }
  function reset(){ T.running = false; T.remaining = dur(T.mode); saveTimer(); renderTimer(); }
  function nextMode(){ if(T.mode!=="focus") return "focus"; return state.cycle>0 && state.cycle % state.settings.interval===0 ? "long" : "short"; }
  function complete(silent){
    rollDay();
    let msg;
    if(T.mode==="focus"){
      const td = todayStr(), d = state.daily[td] || (state.daily[td] = {p:0, m:0, c:{}});
      d.p++; d.m += state.settings.focus; state.cycle++;
      const t = state.tasks.find(x=>x.id===state.activeId && !x.completed);
      if(t){
        t.poms++; t.pomLog[td] = (t.pomLog[td]||0) + 1;
        const pc = t.categories.find(c=>POMO_CATS.includes(c));
        if(pc){ d.c = d.c || {}; d.c[pc] = (d.c[pc]||0) + 1; }
      }
      save();
      msg = t ? "完成一个番茄："+t.title+"（共 "+t.poms+" 个）" : "完成一个番茄，休息一下";
    } else msg = "休息结束，继续专注";
    if(!silent){ chime(); toast(msg); }
    setMode(nextMode(), state.settings.auto && !silent);
    renderAll();
  }
  function skip(){ if(T.mode==="focus"){ rollDay(); state.cycle++; save(); } setMode(nextMode(), false); renderStats(); }

  let tickDay = todayStr();
  setInterval(()=>{
    if(todayStr()!==tickDay){ tickDay = todayStr(); monthSel = tickDay; rollShown = false; if(!demo && rollOver()) save(); renderAll(); }
    if(!T.running) return;
    T.remaining = T.endAt - Date.now();
    if(T.remaining<=0){ T.remaining = 0; complete(false); return; }
    renderTimer();
  }, 250);

  let ac = null;
  function unlockAudio(){ try{ if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); }catch(e){} }
  function chime(){
    if(!state.settings.sound || !ac) return;
    const now = ac.currentTime;
    [0,0.28,0.56].forEach((d,i)=>{
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = [784,988,1175][i];
      g.gain.setValueAtTime(0.0001, now+d); g.gain.exponentialRampToValueAtTime(0.25, now+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001, now+d+0.5);
      o.connect(g).connect(ac.destination); o.start(now+d); o.stop(now+d+0.55);
    });
  }

  const C = 2*Math.PI*108, prog = $("#prog");
  prog.style.strokeDasharray = C;
  (function(){
    let s = "";
    for(let i=0;i<60;i++){
      const a = i/60*2*Math.PI, major = i%5===0, r1 = 128, r2 = major ? 118 : 123;
      s += `<line class="tick${major?" major":""}" x1="${(150+r1*Math.sin(a)).toFixed(1)}" y1="${(158-r1*Math.cos(a)).toFixed(1)}" x2="${(150+r2*Math.sin(a)).toFixed(1)}" y2="${(158-r2*Math.cos(a)).toFixed(1)}"/>`;
    }
    $("#ticks").innerHTML = s;
  })();
  const fmt = ms => { const s = Math.ceil(ms/1000); return pad(Math.floor(s/60))+":"+pad(s%60); };
  function renderTimer(){
    document.body.dataset.mode = T.mode;
    const total = dur(T.mode), frac = total ? clamp(T.remaining/total,0,1) : 0;
    prog.style.strokeDashoffset = C*(1-frac);
    $("#time").textContent = fmt(T.remaining);
    $("#toggle").textContent = T.running ? "暂停" : (T.remaining < total ? "继续" : "开始");
    $$(".modes button").forEach(b=>b.setAttribute("aria-selected", b.dataset.mode===T.mode));
    const t = state.tasks.find(x=>x.id===state.activeId && !x.completed);
    for(const el of [$("#now"), $("#now2")]){
      el.textContent = "";
      if(T.mode!=="focus") el.textContent = T.mode==="short" ? "站起来走走，喝口水" : "好好休息一会儿";
      else if(t){ const pj = getProj(t.project); el.append("正在做 ", pj ? pj.name+" · " : "", h("b",{text:t.title}), t.poms ? "（已 "+t.poms+" 个）" : ""); }
      else el.textContent = "点学习或工作任务旁的 ▶ 开始专注";
    }
    const mt = $("#miniTimer"), wideV = ["week","month","plan"].includes(state.ui.view);
    mt.hidden = !wideV;
    if(wideV){
      mt.classList.toggle("run", T.running); mt.textContent = "";
      mt.append(h("i"), h("b", {text:fmt(T.remaining)}), h("span", {text: T.running ? MODE_NAME[T.mode]+"中 · 点击暂停" : (T.remaining < total ? "已暂停 · 点击继续" : "开始"+MODE_NAME[T.mode])}));
    }
    document.title = T.running ? fmt(T.remaining)+" "+MODE_NAME[T.mode]+"中 – 番茄清单" : "番茄清单";
  }
  function renderStats(){
    rollDay();
    const d = state.daily[todayStr()] || {p:0, m:0, c:{}};
    const p = $("#stats"); p.textContent = "";
    const ps = pomSum([todayStr()]);
    p.append("今天 ", h("strong",{text:ps.p}), " / "+(state.settings.goal||8)+" 个番茄 · ", h("strong",{text:d.m || ps.p*state.settings.focus}), " 分钟");
    const parts = POMO_CATS.map(k=>[k, (d.c||{})[k]||0]);
    if(d.p) p.append(h("br"), ...parts.map(([k,n],i)=>[i?"　":"", h("span",{class:"cat", style:"--c:"+catColor(k)}, k), " "+n]).flat());
    const n = state.settings.interval, k = state.cycle>0 && state.cycle%n===0 ? n : state.cycle%n;
    p.append(h("span", {class:"cycle", title:"距离长休息的进度"}, Array.from({length:n}, (_,i)=>h("i",{class:i<k?"on":null}))));
  }
  function renderAll(){ renderMain(); renderTimer(); renderStats(); if(editId) fillEditor(); }

  $("#toggle").addEventListener("click", toggle);
  $("#miniTimer").addEventListener("click", toggle);
  $("#dial").addEventListener("click", toggle);
  $("#reset").addEventListener("click", reset);
  $("#skip").addEventListener("click", skip);
  let pendingMode = null, pendingTimer;
  $$(".modes button").forEach(b=>b.addEventListener("click", ()=>{
    const m = b.dataset.mode; if(m===T.mode) return;
    if(T.running && pendingMode!==m){ pendingMode = m; clearTimeout(pendingTimer); pendingTimer = setTimeout(()=>pendingMode = null, 3000); toast("计时还在进行，再点一次切换到"+MODE_NAME[m]); return; }
    pendingMode = null; setMode(m, false);
  }));

  const SET = {focus:"#s-focus", short:"#s-short", long:"#s-long", interval:"#s-interval", goal:"#s-goal"};
  function syncSettingsInputs(){ for(const k in SET) $(SET[k]).value = state.settings[k]; $("#s-auto").checked = state.settings.auto; $("#s-sound").checked = state.settings.sound; }
  syncSettingsInputs();
  for(const k in SET){
    $(SET[k]).addEventListener("change", e=>{
      const el = e.target, v = clamp(Math.round(+el.value)||state.settings[k], +el.min, +el.max); el.value = v;
      const wasFull = !T.running && T.remaining===dur(T.mode);
      state.settings[k] = v; save();
      if(wasFull) T.remaining = dur(T.mode);
      saveTimer(); renderTimer(); renderStats(); if(k==="goal") renderMain();
    });
  }
  $("#s-auto").addEventListener("change", e=>{ state.settings.auto = e.target.checked; save(); });
  $("#s-sound").addEventListener("change", e=>{ state.settings.sound = e.target.checked; save(); if(e.target.checked){ unlockAudio(); chime(); } });

  /* ---------- keyboard ---------- */
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape"){ if(!pop.hidden) closePop(); else if(editId) closeEditor(); return; }
    const tag = (e.target.tagName||"").toLowerCase();
    if(["input","textarea","select"].includes(tag) || e.target.isContentEditable || e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.code==="Space" && tag!=="button"){ e.preventDefault(); toggle(); }
    else if(/^[1-7]$/.test(e.key)){ if(e.key==="7") curProj = null; setView(VIEWS[+e.key-1]); }
    else if(e.key==="n" || e.key==="N"){
      e.preventDefault(); closeEditor();
      const q = $("#main .qa-in");
      if(q) q.focus();
      else if(state.ui.view==="plan" || state.ui.view==="week"){ addingDay = todayStr(); addingView = state.ui.view; if(state.ui.view==="plan") planOffset = 0; else weekOffset = 0; focusAdder = true; renderMain(); }
    }
  });

  /* ---------- toast with undo ---------- */
  let toastTimer, undoFn = null;
  function toast(msg, undo){
    $("#toastMsg").textContent = msg; undoFn = undo || null; $("#toastUndo").hidden = !undo;
    $("#toast").classList.add("show"); clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ $("#toast").classList.remove("show"); undoFn = null; }, undo ? 5000 : 2600);
  }
  $("#toastUndo").addEventListener("click", ()=>{ const f = undoFn; undoFn = null; $("#toast").classList.remove("show"); if(f) f(); });

  document.body.classList.add("locked");
  renderAll();
  initAuth();
})();
</script>
</body>
</html>
